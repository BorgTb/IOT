apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    uid: influxdb
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: smarthome
      defaultBucket: sensores
      httpMode: POST
    secureJsonData:
      token: smarthome_token_2024
